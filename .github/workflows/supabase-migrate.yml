name: Apply Supabase migrations

# On every merge to main that ADDS a new migration file, apply just those new
# files to the live Supabase database — so DB changes can ship fully remotely
# (cloud Claude writes the migration -> you merge the PR -> this runs).
#
# Runs ONLY the .sql files ADDED in this push (git diff), each once. We do NOT
# use `supabase db push` (repo files use short date names while the history uses
# full timestamps, so db push would try to re-run the whole folder).
#
# ── ONE-TIME SETUP (browser) ──────────────────────────────────────────────────
#   GitHub -> repo -> Settings -> Secrets and variables -> Actions ->
#   secret name:  SUPABASE_DB_URL
#   value: your full Supabase connection string (Session pooler, URI), with the
#          real DB password filled in, e.g.
#     postgresql://postgres.hjwtjrjkmuhhbsbjsqhx:YOURPASSWORD@aws-1-ap-south-1.pooler.supabase.com:5432/postgres
#   Use an alphanumeric DB password (no symbols) to avoid URL-encoding issues.
#
# ── SAFETY ────────────────────────────────────────────────────────────────────
# Changes the LIVE database automatically on merge — the PR review is the gate.
# Write migrations idempotently and let this Action be the only thing that
# applies them.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Apply newly added migration files
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set or is empty. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Safe diagnostic: show the connection string with the password masked,
          # so we can confirm host/user/structure without leaking the password.
          MASKED="$(printf '%s' "$DATABASE_URL" | sed -E 's,(://[^:/]+:)[^@]*(@),\1********\2,')"
          echo "Using connection string (password masked): $MASKED"
          echo "Secret length: ${#DATABASE_URL}"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-list --max-parents=0 "$AFTER" | tail -n 1)"
          fi

          FILES="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'supabase/migrations/*.sql' | sort)"
          if [ -z "$FILES" ]; then
            echo "No newly added migration files in this push. Nothing to apply."
            exit 0
          fi

          echo "New migrations to apply:"
          echo "$FILES"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "──────────────────────────────────────────"
            echo "Applying: $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "OK: $f"
          done <<< "$FILES"

          echo "All new migrations applied."
