name: Apply Supabase migrations

# On every merge to main that ADDS a new migration file, apply just those new
# files to the live Supabase database — so DB changes can ship fully remotely
# (cloud Claude writes the migration -> you merge the PR -> this runs).
#
# Runs ONLY the .sql files ADDED in this push (git diff), each once. We do NOT
# use `supabase db push` (repo files use short date names while the history uses
# full timestamps, so db push would try to re-run the whole folder).
#
# ── ONE-TIME SETUP (browser) ──────────────────────────────────────────────────
# Paste ONLY the database password (not a URL) into one secret:
#   GitHub -> repo -> Settings -> Secrets and variables -> Actions ->
#   New repository secret:
#     Name:  SUPABASE_DB_PASSWORD
#     Value: your Supabase DB password (Dashboard -> Project Settings ->
#            Database -> Database password -> Reset -> Copy).
# Passed via PGPASSWORD, so special characters are fine (no URL encoding).
#
# ── SAFETY ────────────────────────────────────────────────────────────────────
# Changes the LIVE database automatically on merge — the PR review is the gate.
# Write migrations idempotently and let this Action be the only thing that
# applies them.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Apply newly added migration files
        env:
          # Non-secret connection coordinates, set directly on this step so psql
          # always sees them (Supabase Session pooler — IPv4, works from CI).
          PGHOST: aws-1-ap-south-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.hjwtjrjkmuhhbsbjsqhx
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Target: host=$PGHOST port=$PGPORT db=$PGDATABASE user=$PGUSER sslmode=$PGSSLMODE"
          echo "Password secret length: ${#PGPASSWORD} (0 means the secret is missing/empty)"

          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-list --max-parents=0 "$AFTER" | tail -n 1)"
          fi

          FILES="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'supabase/migrations/*.sql' | sort)"
          if [ -z "$FILES" ]; then
            echo "No newly added migration files in this push. Nothing to apply."
            exit 0
          fi

          echo "New migrations to apply:"
          echo "$FILES"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "──────────────────────────────────────────"
            echo "Applying: $f"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "OK: $f"
          done <<< "$FILES"

          echo "All new migrations applied."
