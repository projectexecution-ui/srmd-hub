name: Apply Supabase migrations

# On every merge to main that ADDS a new migration file, apply just those new
# files to the live Supabase database — so DB changes can ship fully remotely
# (cloud Claude writes the migration -> you merge the PR -> this runs).
#
# Why not `supabase db push`? This repo's migration history uses full-timestamp
# versions (e.g. 20260821094724) while files use short date names
# (e.g. 20260821_*.sql). `db push` matches by that number and would try to
# re-run the WHOLE folder. Instead we run ONLY the .sql files ADDED in this push
# (git diff), each once, when it first lands on main.
#
# ── ONE-TIME SETUP (do this once, in the browser) ─────────────────────────────
# You only need to paste the DATABASE PASSWORD (not a full URL). The host, user
# and db name below are not secret and are fixed for this project.
#   GitHub -> the repo -> Settings -> Secrets and variables -> Actions ->
#   "New repository secret":
#     Name:  SUPABASE_DB_PASSWORD
#     Value: your Supabase database password (Dashboard -> Project Settings ->
#            Database -> Database password -> Reset, then copy it).
# Passing it via PGPASSWORD means special characters are fine — no URL encoding.
#
# ── SAFETY ────────────────────────────────────────────────────────────────────
# This changes the LIVE database automatically on merge, so the PR review IS the
# gate. Write migrations idempotently (create or replace / if not exists) and let
# this Action be the ONLY thing that applies a migration (don't also run it by
# hand) so nothing runs twice.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  # Not secret — the project's Session-pooler coordinates (IPv4, works from CI).
  PGHOST: aws-1-ap-south-1.pooler.supabase.com
  PGPORT: '5432'
  PGUSER: postgres.hjwtjrjkmuhhbsbjsqhx
  PGDATABASE: postgres
  PGSSLMODE: require

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Apply newly added migration files
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # New branch / first push / history rewrite -> compare from the root commit.
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-list --max-parents=0 "$AFTER" | tail -n 1)"
          fi

          FILES="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'supabase/migrations/*.sql' | sort)"

          if [ -z "$FILES" ]; then
            echo "No newly added migration files in this push. Nothing to apply."
            exit 0
          fi

          echo "New migrations to apply:"
          echo "$FILES"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "──────────────────────────────────────────"
            echo "Applying: $f"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "OK: $f"
          done <<< "$FILES"

          echo "All new migrations applied."
