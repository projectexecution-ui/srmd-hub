<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Projects App — Preview</title>
<style>
  :root{
    --page:#FAFAFC; --surface:#FFFFFF; --border:#E9E9F0;
    --text:#16161D; --muted:#6B6B7B;
    --accent:#4F46E5; --accent-soft:#EEF0FE;
    --attn-fill:#FDF7E7; --attn-rule:#EAB308;
    --pos:#16A34A; --neg:#DC2626;
    --rail:240px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--text);
    font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums lining-nums; white-space:nowrap}

  /* ---------- shell ---------- */
  .shell{display:flex; min-height:100vh}
  .rail{
    width:var(--rail); flex:0 0 var(--rail); background:var(--surface);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:18px 16px 14px}
  .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px}
  .brand b{font-size:13px;font-weight:600;letter-spacing:.01em}
  .brand span{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .who{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;border-bottom:1px solid var(--border)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:600;font-size:12px}
  .who div{font-size:13px;font-weight:500}
  .who small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  nav{padding:12px 10px;overflow-y:auto;flex:1}
  .grp{font-size:11px;color:var(--muted);padding:12px 8px 6px;letter-spacing:.02em}
  .item{
    display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;
    color:var(--text);cursor:pointer;font-size:13.5px;
  }
  .item:hover{background:#F4F4F8}
  .item.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .item .ic{width:16px;height:16px;flex:0 0 16px;opacity:.75}
  .item.on .ic{opacity:1}
  .railfoot{padding:12px 10px;border-top:1px solid var(--border)}

  main{flex:1;min-width:0}
  .wrap{max-width:1280px;padding:24px;margin:0 auto}

  /* ---------- header ---------- */
  .head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .head h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em}
  .head .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;height:36px;padding:0 12px;color:var(--muted);font-size:13px;min-width:190px}
  .notif{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;
    background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text);
    font-family:inherit}
  .notif:hover{background:#F4F4F8}
  .notif svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .notif .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;
    padding:1px 7px;font-weight:600;font-variant-numeric:tabular-nums}
  .sync{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px}
  .sync.quiet{color:#A0A0B0;font-size:12px}
  .tick{width:14px;height:14px;border-radius:50%;background:var(--pos);display:inline-block;position:relative}
  .tick:after{content:"";position:absolute;left:4px;top:2.5px;width:4px;height:7px;border:solid #fff;
    border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
  .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .btn:hover{background:#F4F4F8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn.primary:hover{background:#4338CA}

  /* ---------- banner + tiles ---------- */
  .banner{background:var(--attn-fill);border:1px solid #F3E3B3;border-radius:10px;padding:11px 14px;
    font-size:13.5px;margin-bottom:18px;color:#7A5C09;cursor:pointer}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;
    display:flex;gap:14px;align-items:flex-start}
  .tile.attn{background:var(--attn-fill);border-color:#F3E3B3}
  .tile .box{width:38px;height:38px;border-radius:9px;background:#F1F1F7;display:grid;place-items:center;
    font-size:16px;flex:0 0 38px}
  .tile.attn .box{background:#F8ECC9}
  .tile .lab{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .tile .fig{font-size:26px;font-weight:600;line-height:1.15;margin-top:2px}
  .tile .ctx{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* ---------- table card ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .card .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .bar .right{margin-left:auto;display:flex;gap:8px}
  .mini{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
  .mini.on{background:var(--accent-soft);border-color:#D9DCFB;color:var(--accent)}

  table{width:100%;border-collapse:collapse}
  thead th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:right;padding:10px 16px;
    border-bottom:1px solid var(--border);white-space:nowrap}
  thead th:first-child{text-align:left}
  tbody td{padding:0 16px;height:44px;border-bottom:1px solid #F2F2F6;text-align:right;font-size:13px}
  tbody td:first-child{text-align:left}
  tbody tr:last-child td{border-bottom:0}
  tr.grouprow{cursor:pointer}
  tr.grouprow:hover td{background:#FBFBFE}
  tr.grouprow td:first-child{font-weight:500}
  .chev{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  tr.open .chev{transform:rotate(90deg)}
  .count{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px}
  tr.child td{background:#FCFCFE;color:#3A3A48;font-size:12.5px}
  tr.child td:first-child{padding-left:44px}
  tr.gchild td:first-child{padding-left:70px;color:var(--muted)}
  tr.gchild.order td:first-child{color:var(--text)}
  tr.gchild.order{cursor:pointer}
  tr.line td{background:#FDFDFF;font-size:12.5px;color:#3A3A48}
  tr.line td:first-child{padding-left:96px}
  .pct{font-weight:500}
  .dash{color:#C3C3CE}
  .bar-mini{height:5px;border-radius:999px;background:#EFEFF5;overflow:hidden;width:74px;display:inline-block;
    vertical-align:middle;margin-right:9px}
  .bar-mini i{display:block;height:100%;background:var(--accent);border-radius:999px}

  /* ---------- project workspace ---------- */
  .back{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:10px}
  .back:hover{color:var(--accent)}
  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin:18px 0 20px;
    padding-bottom:0;scrollbar-width:thin}

  /* compact project header */
  .phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
  .phead h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  .pmeta{display:flex;align-items:center;gap:0;color:var(--muted);font-size:12.5px;min-width:0}
  .pmeta span{padding:0 10px;border-left:1px solid var(--border);white-space:nowrap}
  .pmeta span:first-child{border-left:0;padding-left:0}
  .pmeta b{color:#3A3A48;font-weight:500}
  .phead .actions{gap:8px}

  /* ribbon tab bar — all tabs visible, grouped, no scrolling, no overflow menu */
  .ribbon{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);
    margin-bottom:14px;padding-bottom:6px}
  .rgroup{display:flex;flex-direction:column;padding:0 9px;border-left:1px solid var(--border);min-width:0}
  .rgroup:first-child{border-left:0;padding-left:0}
  .rgroup .items{display:flex;gap:2px}
  .rgroup .cap{font-size:10px;color:#A0A0B0;text-align:center;margin-top:4px;letter-spacing:.03em}
  .rtab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 8px 6px;border-radius:8px;
    cursor:pointer;color:var(--muted);min-width:62px;line-height:1}
  .rtab:hover{background:#F4F4F8;color:var(--text)}
  .rtab.on{background:var(--accent-soft);color:var(--accent)}
  .rtab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .rtab span{font-size:11px;white-space:nowrap}
  .rtab.on span{font-weight:500}
  @media (max-width:1180px){
    .rtab{min-width:0;padding:8px 9px}
    .rtab span{display:none}
    .rgroup .cap{display:none}
  }
  @media (max-width:760px){
    .ribbon{overflow-x:auto;scrollbar-width:thin}
  }

  /* approval chain */
  .chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px}
  .step{display:flex;align-items:center;gap:7px;padding:0 14px;border-left:1px solid var(--border);color:var(--muted)}
  .step:first-child{border-left:0;padding-left:0}
  .step i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;
    font-size:10px;background:#EFEFF5;color:var(--muted);flex:0 0 16px}
  .step.done i{background:var(--pos);color:#fff}
  .step.now{color:var(--text);font-weight:500}
  .step.now i{background:var(--attn-rule);color:#fff}
  .req{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
  .reqtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13.5px}
  .reqtop b{font-weight:600}
  .reqtop .amt{margin-left:auto;font-weight:600}
  .reqtop .who2{color:var(--muted);font-size:12.5px;width:100%}
  .req .chain{border:0;padding:0;margin:0;background:none}
  .quietnote{color:var(--muted);font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid #F2F2F6}
  .mismatch{color:#92400E;background:var(--attn-fill);border:1px solid #F3E3B3;border-radius:8px;
    padding:9px 11px;font-size:12.5px;margin-top:10px}
  .owed{color:var(--neg);font-weight:600}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#F1F1F7;
    color:var(--muted);margin-right:5px}
  .chip.ok{background:#E8F6EC;color:#166534}
  .chip.mode{background:var(--accent-soft);color:var(--accent)}
  .abstract{text-align:left !important;padding:14px 16px 14px 96px !important;background:#FBFBFE}
  .abtitle{font-size:12.5px;font-weight:600;margin-bottom:10px}
  .abtitle .count{font-weight:400}
  .abgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
  .ab{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px}
  .ab span{font-size:11px;color:var(--muted)}
  .ab b{font-size:13.5px}
  @media (max-width:960px){ .abgrid{grid-template-columns:repeat(2,1fr)} }
  .tiles.four{grid-template-columns:repeat(4,1fr)}
  @media (max-width:1100px){ .tiles.four{grid-template-columns:repeat(2,1fr)} }
  tbody td em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}
  .chip.warn{background:var(--attn-fill);color:#92400E}
  .tiles.five{grid-template-columns:repeat(5,1fr);gap:12px}
  @media (max-width:1200px){ .tiles.five{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:760px){ .tiles.five{grid-template-columns:repeat(2,1fr)} }
  .tiles.five .tile{padding:14px}
  .tiles.five .lab{font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
  .tiles.five .fig{font-size:22px;margin-top:4px}
  .tiles.five .persft{font-size:12px;color:var(--muted);margin-top:1px}
  .tiles.five .ctx{margin-top:6px}
  .ietable thead th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;vertical-align:bottom}
  .ietable thead th .sub{display:block;font-size:9.5px;text-transform:none;letter-spacing:0;
    color:#B0B0BE;font-weight:400;margin-top:2px}
  .ietable tbody td{height:52px}
  .ccode{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .ietable .est{color:var(--accent);font-weight:500}
  .ietable .await{color:#C08A1E}
  .ietable .hub{color:var(--pos)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:999px;
    border:1px solid #CFE9D8;background:#F0FAF3;color:#166534;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  @media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} }
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;
    border-top:3px solid var(--border)}
  .kpi.k-ie{border-top-color:#4F46E5} .kpi.k-aw{border-top-color:#EAB308}
  .kpi.k-bd{border-top-color:#2563EB} .kpi.k-wo{border-top-color:#9333EA}
  .kpi.k-pd{border-top-color:#EA7C0B}
  .kpi .lab{font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
  .kpi .fig{font-size:22px;font-weight:600;margin-top:5px;line-height:1.15}
  .kpi .persft{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi .ctx{font-size:12px;color:var(--muted);margin-top:7px}
  .ietable thead th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;vertical-align:bottom}
  .ietable thead th .sub{display:block;font-size:9.5px;text-transform:none;letter-spacing:0;
    color:#B0B0BE;font-weight:400;margin-top:2px}
  .ietable tbody td{height:54px}
  .ietable tbody tr.child td{background:var(--surface)}
  .ccode{color:#A0A0B0;font-size:11.5px;font-variant-numeric:tabular-nums;margin-right:4px}
  .subname{padding-left:44px !important}
  .ietable .est{color:var(--accent);font-weight:500}
  .ietable .await .dash{color:#E0B44A}
  .ietable .hub{color:var(--pos)}
  .ietable .hub .dash{color:#9CC9AC}
  .shchip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:5px;margin-left:8px;
    border:1px solid #D9DCFB;background:var(--accent-soft);color:var(--accent)}
  .acts{text-align:right !important;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:999px;
    border:1px solid #CFE9D8;background:#F0FAF3;color:#166534;white-space:nowrap}
  .pill.req{border-color:#D9DCFB;background:var(--surface);color:var(--accent);margin-left:6px}
  .ico{color:#C3C3CE;font-size:14px;padding:0 4px}
  .addrow{padding:10px 16px 10px 44px !important;background:var(--surface) !important;height:auto !important}
  .addbtn{display:inline-block;font-size:12px;padding:5px 12px;border:1px dashed var(--border);
    border-radius:7px;color:var(--muted)}
  tr.hastree{cursor:pointer}
  .treecell{padding:0 !important;height:auto !important;background:#F7F7FB !important}
  .sheetbox{margin:0 16px 14px 44px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);overflow:hidden}
  .sheethead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);
    font-size:13px;background:#FBFBFE}
  .sheethead b{color:var(--accent);font-weight:500}
  .sheethead .st{color:var(--muted);font-size:12.5px}
  .sheethead .wscode{color:#B0B0BE;font-size:11.5px}
  .sheethead .right{margin-left:auto;font-weight:600}
  .sheettable{width:100%;border-collapse:collapse}
  .sheettable thead th{font-size:10px;letter-spacing:.04em;color:var(--muted);font-weight:500;
    padding:8px 14px;border-bottom:1px solid var(--border);text-align:right;text-transform:uppercase}
  .sheettable thead th:nth-child(1),.sheettable thead th:nth-child(2){text-align:left}
  .sheettable tbody td{padding:9px 14px;height:auto;font-size:12.5px;text-align:right;
    border-bottom:1px solid #F4F4F8}
  .sheettable .rno{width:38px;text-align:left;color:#B0B0BE;font-size:11.5px}
  .sheettable .rdesc{text-align:left}
  .cellref{display:block;font-size:10.5px;color:var(--pos);margin-top:2px;font-family:ui-monospace,monospace}
  .sheettable tbody td em{display:block;font-style:normal;font-size:10.5px;color:#B0B0BE;margin-top:1px}
  .sheettable tfoot td{padding:10px 14px;font-size:12.5px;text-align:right;border-top:1px solid var(--border)}
  .sheettable tfoot td:nth-child(2){text-align:left}
  .sheettable tfoot tr.gt td{background:#FBFBFE}
  .acard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
  .acard.ret{border-left:3px solid var(--attn-rule)}
  .atop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13.5px}
  .atop b{font-weight:600}
  .atop .amt2{margin-left:auto;font-weight:600;text-align:right}
  .atop .amt2 em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
  .arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
  .chain2{display:inline-flex;align-items:center;gap:4px}
  .chain2 .lab{font-size:10px;color:#B0B0BE;margin-right:2px}
  .st2{font-size:10.5px;border-radius:5px;padding:2px 7px;background:#F1F1F7;color:var(--muted)}
  .st2.done{background:#E8F6EC;color:#166534}
  .st2.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .wait{font-size:12px;color:var(--muted)}
  .wait.late{color:var(--neg);font-weight:600}
  .erp{font-size:12px;color:var(--muted)}
  .erp b{color:var(--text);font-weight:500}
  .after{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;
    border-top:1px solid #F2F2F6;font-size:12.5px;color:var(--muted)}
  .after b{color:var(--text)}
  .after .delta{color:#92400E}
  .reason{margin-top:10px;background:var(--attn-fill);border:1px solid #F3E3B3;border-radius:8px;
    padding:9px 11px;font-size:12.5px;color:#7A5C09}
  .reason b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .acts2{gap:6px}
  .myhead h2{font-size:24px;font-weight:600;margin:0}
  .myhead .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .myhead .myline{display:flex;align-items:center;margin:16px 0 12px;font-size:12.5px;color:var(--muted)}
  .myhead .viewall{margin-left:auto;border:1px solid var(--border);background:var(--surface);
    border-radius:8px;padding:7px 12px;color:var(--accent);font-size:12.5px;cursor:pointer}
  .pcard{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;
    background:var(--surface);margin-bottom:16px;overflow:hidden}
  .phead2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 16px;background:#FAFAFE}
  .phead2 b{font-size:15px;font-weight:600}
  .picon{width:24px;height:24px;border-radius:6px;background:#EEF0FE;color:var(--accent);
    display:grid;place-items:center;font-size:12px}
  .waiting{margin-left:auto;font-size:11.5px;padding:3px 10px;border-radius:999px;

function go(patch){
  if (patch.tab && patch.tab !== state.tab) { patch.sub = 0; patch.menu = false; patch.party = null; }

  Object.assign(state, patch); render();

  document.getElementById('nav').innerHTML = RAIL.map(r =>

const STAGES = [{n:1,k:'PH'},{n:2,k:'Atm'},{n:3,k:'Trustee'}];
const stageOf = st => st === 'submitted' ? 1 : st === 'ph_approved' ? 2 : st === 'atm_approved' ? 3 : 0;
const daysSince = d => Math.max(0, Math.floor((new Date(LIVE.appr.today) - new Date(d)) / 86400000));

function stageChain(st, mine){
  const cur = stageOf(st);
  return `<div class="chain2"><span class="lab">sign-off</span>` + STAGES.map(x => {
    const done = x.n < cur, isCur = x.n === cur;
    const cls = done ? 'done' : isCur ? 'cur' : '';
    const txt = done ? x.k + ' ✓' : (isCur && mine ? x.k + ' · you' : x.k);
    return `<span class="st2 ${cls}">${txt}</span>`;
  }).join('') + `</div>`;
}

function apprCard(r, mine){
  const sft = r.sft ? `<em>₹${Math.round(r.amt/r.sft).toLocaleString('en-IN')}/sft</em>` : '';
  const wait = daysSince(r.sub);
  const late = wait > 7;
  const erpNew = !r.eb;
  const strip = erpNew
    ? `<span class="chip warn">new ERP budget — no budget line yet</span>`
    : `<span class="erp">ERP budget <b>${inr(r.eb)}</b>${r.sft?` · ₹${Math.round(r.eb/r.sft).toLocaleString('en-IN')}/sft`:''}</span>
       <span class="erp">WO/PO <b>${inr(r.ew)}</b> · ${pct(r.ew,r.eb)}</span>
       <span class="erp">Paid <b>${inr(r.ep)}</b> · ${pct(r.ep,r.eb)}</span>`;
  const after = r.eb ? `<div class="after"><span>Approved so far → after this</span>
      <b class="num">${inr(r.eb)} → ${inr(r.eb + r.amt)}</b>
      <span class="delta">+${pct(r.amt, r.eb)}</span></div>` : '';
  return `
  <div class="acard ${r.st==='returned'?'ret':''}">
    <div class="atop">
      <b>${r.code}</b>
      <span class="count">${r.proj} · ${r.disc} › ${r.scode} ${r.sname}</span>
      <span class="num amt2">${inr(r.amt)}${sft}</span>
    </div>
    <div class="arow">
      ${r.st === 'returned'
        ? `<span class="chip warn">returned to engineer</span>`
        : stageChain(r.st, mine)}
      <span class="wait ${late?'late':''}">${wait} day${wait===1?'':'s'} waiting</span>
      <span class="chip mode">${r.mode.replace('_',' ')}</span>
      <span class="chip">${r.rows} row${r.rows===1?'':'s'}</span>
    </div>
    <div class="arow">${strip}</div>
    ${after}
    ${r.reason ? `<div class="reason"><b>Reason on return</b> ${r.reason}</div>` : ''}
    <div class="arow acts2">
      ${r.st === 'returned'
        ? `<span class="pill req">Open sheet</span>`
        : `<span class="pill done">✓ Approve</span><span class="pill req">↩ Return with reason</span>
           <span class="pill req">Set deadline</span><span class="pill req">Open sheet</span>`}
    </div>
  </div>`;
}

function approvalsTab(){
  if (state.sub === 0) return myApprovals();
  const all = LIVE.appr.rows;
  const pending  = all.filter(r => r.st !== 'returned');
  const returned = all.filter(r => r.st === 'returned');
  if (state.sub === 3) return `<div class="stub"><h3>Transfers</h3>
    <p>Budget moved between sub-categories, waiting to be accepted by the receiving side.</p>
    <p style="margin:0"><span class="na">No transfers in the inbox right now.</span></p></div>`;
  const list = state.sub === 1 ? pending : returned;
  return (list.length ? list.map(r => apprCard(r, false)).join('')
                      : `<div class="stub"><p style="margin:0">Nothing here.</p></div>`) +
    `<div class="legend">Live from CT HUB working sheets. Sign-off runs
     <b>Project Head → Atm Head → Trustee</b>; a sheet stays pending until released in full.</div>`;
}

function catView(){
  const IE = LIVE.ie3, area = IE.area;
  const per = v => `<em>₹${Math.round(v/area).toLocaleString('en-IN')}/sft</em>`;
  const cell = (v, cls, withSft) => v
    ? `<td class="num ${cls||''}">${inr(v)}${withSft ? per(v) : ''}</td>`

/* WO/PO → BOQ upload: the round trip between CT HUB and IN4 */
function boqUploadView(){
  const wos = LIVE.wos;
  const withBoq = wos.filter(w => LIVE.boq[w.id]);
  const items = withBoq.reduce((a,w)=>a + LIVE.boq[w.id].length, 0);
  const rows = withBoq.map(w => {
    const it = LIVE.boq[w.id];
    const oa = it.reduce((a,x)=>a+x.oa,0), ea = it.reduce((a,x)=>a+x.ea,0);
    const state2 = ea === 0 ? ['Not started','ub-step']
                 : ea >= oa ? ['Fully executed','ub-step done']
                 : ['In progress','ub-step'];
    return `
      <tr>
        <td class="rdesc">${w.no.split('/').slice(-2).join('/')}
          <span class="cellref">${w.party} · ${w.cat}</span></td>
        <td class="num">${it.length}</td>
        <td class="num">${inr(oa)}</td>
        <td class="num">${inr(ea)}</td>
        <td class="num pct">${pct(ea,oa)}</td>
        <td><span class="${state2[1]}">${state2[0]}</span></td>
        <td class="acts"><span class="pill req">⤓ Template</span><span class="pill req">↥ Upload</span></td>
      </tr>`;
  }).join('');

  return `
  <div class="tiles">
    <div class="tile"><div class="box">▤</div><div><div class="lab">Work orders with a BOQ</div>
      <div class="fig num">${withBoq.length}</div><div class="ctx">${items} items mirrored from IN4</div></div></div>
    <div class="tile"><div class="box">⤓</div><div><div class="lab">Templates pulled from IN4</div>
      <div class="fig num">95</div><div class="ctx">19 sub-projects · last 3 Aug 2026</div></div></div>
    <div class="tile attn"><div class="box">↥</div><div><div class="lab">Filled BOQs uploaded back</div>
      <div class="fig num">0</div><div class="ctx">of 95 — the import side has never been used</div></div></div>
  </div>
  <div class="card">
    <div class="bar">One row per work order. Download IN4's BOQ template, fill it in the app, approve it,
      then upload it back — IN4's own importer takes it from there.</div>
    <table class="sheettable" style="border-collapse:collapse">
      <thead><tr><th>WORK ORDER</th><th>BOQ ITEMS</th><th>ORDERED</th><th>EXECUTED</th>
        <th>% DONE</th><th>STATE</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="legend">
    IN4's importer lands on <b>ENGG_TEMP_IMPORT_BOQ_ITEM</b>, so the template columns are fixed:
    <b>EXCEL_SL_NO, NAME, DESCRIPTION, NOTES, REMARKS, SKILL_ID, UOM, QUANTITY, RATE,
    REVENUE_QUANTITY, REVENUE_RATE, BOQ_LEVEL, Floor, Unit</b>. <code>ENGG_BOQ_MAPTEMPLATE</code>
    is empty, so there is no saved column mapping to inherit — that staging table is the format.<br>
    The audit log shows <b>95 template downloads since March 2023 and not one upload</b>. Worth
    confirming with In4Velocity that the import is enabled before the app is built around it.</div>`;
}

function acctLegend(){

    <b>Dates come from contractor certificates only.</b> The supplier certificate feed carries no date
    column in IN4, so supplier payments appear in the party ledger but not in the month or FY split —
    adding a date to that feed would close the gap.</div>`;

/* Party ledger, Tally format: Date · Particulars · Vch Type · Vch No. · Debit · Credit */
function partyLedger(name){
  const L = LIVE.ledgers[name] || [];
  const P = LIVE.acct.parties.find(x => x.n === name) || {};
  const d = v => v ? v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) : '';
  const dt = x => { const [y,m,day] = x.split('-'); return day+'-'+MON[+m-1]+'-'+y.slice(2); };

  let bal = 0, dr = 0, cr = 0;
  const rows = [];
  L.forEach(c => {
    // the bill credits the party
    bal -= c.g; cr += c.g;
    rows.push({dt:c.dt, part:`${c.ct} bill — ${c.inv}`, sub:`WO ${c.wo}`,
               vt:'Purchase', vn:c.inv, debit:0, credit:c.g, bal});
    // recoveries and retention debit the party
    if (c.ret){ bal += c.ret; dr += c.ret;
      rows.push({dt:c.dt, part:'Retention withheld', sub:c.inv, vt:'Journal', vn:c.inv,
                 debit:c.ret, credit:0, bal}); }
    if (c.adv){ bal += c.adv; dr += c.adv;
      rows.push({dt:c.dt, part:'Advance recovered', sub:c.inv, vt:'Journal', vn:c.inv,
                 debit:c.adv, credit:0, bal}); }
    if (c.ded){ bal += c.ded; dr += c.ded;
      rows.push({dt:c.dt, part:'Deductions', sub:c.inv, vt:'Journal', vn:c.inv,
                 debit:c.ded, credit:0, bal}); }
    if (c.p){ bal += c.p; dr += c.p;
      rows.push({dt:c.dt, part:'Payment', sub:c.inv, vt:'Receipt', vn:c.inv,
                 debit:c.p, credit:0, bal}); }
  });

  const body = rows.map(r => `
    <tr>
      <td class="tdate">${dt(r.dt)}</td>
      <td class="tpart">${r.debit ? 'Dr' : 'Cr'} &nbsp;${r.part}<span class="cellref">${r.sub}</span></td>
      <td class="tvt">${r.vt}</td>
      <td class="tvn">${r.vn}</td>
      <td class="num">${d(r.debit)}</td>
      <td class="num">${d(r.credit)}</td>
      <td class="num tbal">${d(Math.abs(r.bal))} ${r.bal < 0 ? 'Cr' : 'Dr'}</td>
    </tr>`).join('');

  return `
  <button class="back" onclick="go({party:null})">← All parties</button>
  <div class="ledgerhead">
    <h2>${name}</h2>
    <div class="sub">Ledger Account · New Guest House · SRASSK</div>
    <div class="sub">1-Apr-23 to 4-Sep-26 · ${L.length} certificates</div>
  </div>
  <div class="card wide">
    <div class="bar">Tally format — bills credit the party, payments and recoveries debit it.
      <div class="right"><button class="mini">⤓ Excel</button><button class="mini">⎙ Print</button></div>
    </div>
    <table class="tally">
      <thead><tr><th>Date</th><th>Particulars</th><th>Vch Type</th><th>Vch No.</th>
        <th>Debit</th><th>Credit</th><th>Balance</th></tr></thead>
      <tbody>
        <tr class="tsub"><td></td><td>Opening Balance</td><td colspan="3"></td><td class="num"></td>
          <td class="num tbal">0.00</td></tr>
        ${body}
      </tbody>
      <tfoot>
        <tr><td></td><td><b>Current Total</b></td><td colspan="2"></td>
          <td class="num"><b>${d(dr)}</b></td><td class="num"><b>${d(cr)}</b></td><td></td></tr>
        <tr class="tclose"><td></td><td><b>Closing Balance</b></td><td colspan="3"></td>
          <td class="num"><b>${d(Math.abs(bal))} ${bal < 0 ? 'Cr' : 'Dr'}</b></td><td></td></tr>
      </tfoot>
    </table>
  </div>
  <div class="legend">
    Every line is an IN4 certificate broken into its parts — the gross bill credits the party, then
    retention, advance recovery, deductions and the payment debit it. The closing balance is what the
    project still owes: <b>${inr(P.o || 0)}</b> outstanding${P.r ? ` and ${inr(P.r)} held as retention` : ''}.<br>
    Vch No. is IN4's invoice number, so it ties to the physical bill during reconciliation.</div>`;
}



/* Procurement flow — indent approval, PO approval, GRN, all on live IN4 data */
const THRESHOLD = 100000;   // below this, one approval; above, the full chain

function indentsView(){
  if (state.sub === 3) return materialMaster();
  if (state.sub === 2) return rateHistory();
  if (state.sub === 1) return openPos();

}

function flowStrip(active){
  const steps = [
    ['Indent keyed in IN4','erp'], ['Approved in app','app'], ['Approved in IN4','erp'],
    ['PO made in IN4','erp'], ['PO approved in app','app'], ['GRN in IN4','erp'],
  ];
  return `<div class="uploadbar">
    ${steps.map((x,i) => `<span class="ub-step ${i < active ? 'done' : ''} ${i === active ? 'now2' : ''}">

      .join('<span class="ub-arrow">›</span>')}

}

function approvalQueue(){
  const D = LIVE.proc.drafts, P = LIVE.proc;

  return `

    <div class="tile"><div class="box">▣</div><div><div class="lab">Open POs</div>

const JMR_ENTRIES = {
  // measurements the app would hold, against BOQ item 6340 on WO 623
  6340: [
    {d:'2026-04-02', loc:'NGH B · 2nd floor · grid A1–A6', q:1420.5,  by:'R. Patel'},
    {d:'2026-04-09', loc:'NGH B · 2nd floor · grid A7–B4', q:1180.25, by:'R. Patel'},

    {d:'2026-04-27', loc:'NGH B · 3rd floor · grid A7–B4',  q:948.75, by:'R. Patel'},
  ],
};

function jmrView(){
  const wo = LIVE.wos.find(w => w.id === 623);
  const items = LIVE.boq[623] || [];
  const item = items.find(i => i.id === 6340);
  const bills = LIVE.itembills['623:6340'] || [];
  const entries = JMR_ENTRIES[6340];
  const measured = entries.reduce((a,e)=>a+e.q, 0);

  if (state.sub === 3) return jmrRegister();

  if (state.sub === 2) {
    // measured against certified, per bill
    const apr = bills.find(b => b.b === 'SRASSK-GHB/11');
    const rows = bills.map(b => {
      const inWindow = b.b === 'SRASSK-GHB/11';
      const m = inWindow ? measured : null;
      return `
      <tr>
        <td class="rdesc">${b.b}<span class="cellref">${b.d}</span></td>
        <td class="num">${qty(b.q)}</td>
        <td class="num">${m === null ? '<span class="na" title="No measurements captured in the app for this period">not measured</span>' : qty(m)}</td>
        <td class="num">${m === null ? '' : (m - b.q > 0 ? '+' : '') + qty(m - b.q)}</td>
        <td>${m === null ? '' : (Math.abs(m - b.q) > 1
          ? '<span class="pill req" style="border-color:#F3E3B3;background:var(--attn-fill);color:#92400E">check</span>'
          : '<span class="pill done">✓ matches</span>')}</td>
      </tr>`;
    }).join('');
    return `
    <div class="tiles">
      <div class="tile"><div class="box">✓</div><div><div class="lab">Certified in IN4</div>
        <div class="fig num">${qty(item.eq)}</div><div class="ctx">${item.u} · ${bills.length} bills</div></div></div>
      <div class="tile"><div class="box">▤</div><div><div class="lab">Measured in the app</div>
        <div class="fig num">${qty(measured)}</div><div class="ctx">${entries.length} entries, one bill period</div></div></div>
      <div class="tile attn"><div class="box">◷</div><div><div class="lab">Difference</div>
        <div class="fig num">${qty(measured - (apr ? apr.q : 0))}</div>
        <div class="ctx">on the one period with measurements</div></div></div>
    </div>
    <div class="card wide">
      <div class="bar">${item.n} · ordered ${qty(item.oq)} ${item.u} — what IN4 certified against what site measured.</div>
      <table class="sheettable">
        <thead><tr><th>BILL</th><th>CERTIFIED QTY</th><th>MEASURED QTY</th><th>DIFFERENCE</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="legend">
      Eleven of the twelve bills predate the app, so they read <b>not measured</b> — that is the honest
      state, not a zero. From here on every bill gets a measured figure beside it, and a difference
      beyond tolerance is raised <b>before</b> the certificate is paid rather than found afterwards.</div>`;

/* ---- view 2: category -> sub-category -> order -> line, live from IN4 ---- */
function ordersView(inBudget){
  const showWO = inBudget || state.sub !== 2;
  const showPO = inBudget || state.sub !== 1;
  const POS = showPO ? LIVE.polines : [], WOS = showWO ? LIVE.wos : [];

  // tree: category -> sub-category -> orders
  const tree = {};
  WOS.forEach(w => {
    const c = tree[w.cat] = tree[w.cat] || {};
    (c[w.sub] = c[w.sub] || []).push({kind:'WO', ...w});
  });
  POS.forEach(l => {
    const c = tree[l.cat] = tree[l.cat] || {};
    const sub = '(material — no sub-category in IN4)';
    const list = c[sub] = c[sub] || [];
    let o = list.find(x => x.no === l.po);
    if (!o) { o = {kind:'PO', no:l.po, party:l.sup, dt:l.dt, lines:[]}; list.push(o); }
    o.lines.push(l);
  });

  const woVal = WOS.reduce((a,w)=>a+w.val,0), woCert = WOS.reduce((a,w)=>a+w.cert,0);
  const woOut = WOS.reduce((a,w)=>a+w.out,0), woAdv = WOS.reduce((a,w)=>a+w.advbal,0);
  const poVal = POS.reduce((a,l)=>a+l.amt,0);

  let ci=0, si=0, oi=0, rows='';
  Object.keys(tree).sort().forEach(cat => {
    const c = ci++;
    const subs = tree[cat];
    const all = Object.values(subs).flat();
    const cOrd = all.reduce((a,o)=>a + (o.kind==='WO' ? o.val : o.lines.reduce((x,l)=>x+l.amt,0)), 0);
    const cDone = all.reduce((a,o)=>a + (o.kind==='WO' ? o.cert : o.lines.reduce((x,l)=>x+l.gv,0)), 0);
    rows += `
      <tr class="grouprow" onclick="tgl('cc${c}', this)">
        <td><span class="chev">›</span> ${cat}<span class="count">${all.length} order${all.length>1?'s':''}</span></td>
        <td colspan="3"></td><td class="num">${inr(cOrd)}</td><td colspan="2"></td>
        <td class="num">${inr(cDone)}</td><td class="num pct">${pct(cDone,cOrd)}</td>
      </tr>`;

    Object.keys(subs).forEach(sub => {
      const sI = si++, list = subs[sub];
      const sOrd = list.reduce((a,o)=>a + (o.kind==='WO' ? o.val : o.lines.reduce((x,l)=>x+l.amt,0)), 0);
      const sDone = list.reduce((a,o)=>a + (o.kind==='WO' ? o.cert : o.lines.reduce((x,l)=>x+l.gv,0)), 0);
      rows += `
        <tr class="child cc${c}" style="display:none" onclick="tgl('ss${sI}', this, event)">
          <td><span class="chev">›</span> ${sub}<span class="count">${list.length}</span></td>
          <td colspan="3"></td><td class="num">${inr(sOrd)}</td><td colspan="2"></td>
          <td class="num">${inr(sDone)}</td><td class="num pct">${pct(sDone,sOrd)}</td>
        </tr>`;

      list.forEach(o => {
        const oI = oi++;
        if (o.kind === 'WO') {
          rows += `
            <tr class="gchild ss${sI} order" style="display:none" onclick="tgl('oo${oI}', this, event)">
              <td><span class="chev">›</span> <b>${o.no.split('/').slice(-2).join('/')}</b>
                <span class="kind k-wo">WO</span><span class="count">${o.party}</span></td>
              <td colspan="3"></td><td class="num">${inr(o.val)}</td><td colspan="2"></td>
              <td class="num">${inr(o.cert)}</td><td class="num pct">${pct(o.cert,o.val)}</td>
            </tr>` +
            (o.certs.length ? abstractRow(o, oI) + boqPanel(o, oI) + o.certs.map(b => `
              <tr class="line oo${oI}" style="display:none">
                <td>${b.inv}<span class="count">${b.t}</span></td>
                <td class="num">${b.dt}</td>
                <td class="num">${inr(b.g)}</td>
                <td class="num">${b.ret ? inr(b.ret) : '<span class="dash">—</span>'}</td>
                <td class="num">${b.adv ? inr(b.adv) : '<span class="dash">—</span>'}</td>
                <td colspan="2"></td>
                <td class="num">${inr(b.c)}</td>
                <td class="num">${b.out ? '<b class="owed">'+inr(b.out)+'</b>' : inr(b.p)}</td>
              </tr>`).join('')
             : `<tr class="line oo${oI}" style="display:none">
                  <td colspan="9" style="padding:11px 16px 11px 96px;color:var(--muted)">
                    No certificate raised yet · advance outstanding ${inr(o.advbal)}</td></tr>`);
        } else {
          const ord = o.lines.reduce((a,l)=>a+l.amt,0), got = o.lines.reduce((a,l)=>a+l.gv,0);
          rows += `
            <tr class="gchild ss${sI} order" style="display:none" onclick="tgl('oo${oI}', this, event)">
              <td><span class="chev">›</span> <b>${o.no.split('/').slice(-2).join('/')}</b>
                <span class="kind k-po">PO</span><span class="count">${o.party} · ${o.dt}</span></td>
              <td colspan="3"></td><td class="num">${inr(ord)}</td><td colspan="2"></td>
              <td class="num">${inr(got)}</td><td class="num pct">${pct(got,ord)}</td>
            </tr>` +
            o.lines.map(l => `
              <tr class="line oo${oI}" style="display:none">
                <td>${l.item}</td>
                <td class="num">${l.u}</td>
                <td class="num">${num(l.q)}</td>
                <td class="num">${inr(l.r)}</td>
                <td class="num">${inr(l.amt)}</td>
                <td class="num">${num(l.gq)}</td>
                <td class="num">${num(l.q-l.gq)}</td>
                <td class="num">${l.gv ? inr(l.gv) : '<span class="dash">—</span>'}</td>
                <td class="num pct"><span class="bar-mini" style="width:42px"><i style="width:${Math.min(100,Math.round(l.gq/l.q*100))}%"></i></span>${pct(l.gq,l.q)}</td>
              </tr>`).join('');
        }
      });
    });
  });

  return `
  <div class="tiles">
    <div class="tile"><div class="box">▣</div><div><div class="lab">Orders</div>
      <div class="fig num">${WOS.length + new Set(POS.map(l=>l.po)).size}</div>
      <div class="ctx">${WOS.length} work orders · ${new Set(POS.map(l=>l.po)).size} POs</div></div></div>
    <div class="tile"><div class="box">₹</div><div><div class="lab">Ordered</div>
      <div class="fig num">${inr(woVal+poVal)}</div>
      <div class="ctx">${inr(woVal)} contractor · ${inr(poVal)} material</div></div></div>
    <div class="tile attn"><div class="box">◷</div><div><div class="lab">Outstanding</div>
      <div class="fig num">${inr(woOut)}</div>
      <div class="ctx">certified, not paid · advance ${inr(woAdv)} to recover</div></div></div>
  </div>
  <div class="card wide">
    <div class="bar">${inBudget
      ? 'Spend against the budget, by order. Same figures as Procurement → WO / PO, cut under the budget categories.'
      : 'Category → sub-category → order → line. A PO opens to its items; a work order opens to its certificates.'}
      Live from IN4 · synced ${LIVE.syncedAt}.
      <div class="right">${inBudget ? '' : ['All orders','Work orders','POs'].map((l,i) =>
        `<button class="mini ${state.sub===i?'on':''}" onclick="go({sub:${i}})">${l}</button>`).join('')}</div>
    </div>
    <table>
      <thead><tr>
        <th>Category / sub-category / order / line</th>
        <th>Unit · date</th><th>Qty · gross bill</th><th>Rate · retention</th>
        <th>Order value</th><th>Recd qty</th><th>Pending qty</th>
        <th>Certified / received</th><th>% · outstanding</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="legend">
    <b>Work order lines are its certificates</b> — bill no, type (Running / Advance / Final / Retention),
    date, gross bill, retention held, advance recovered, certified, and what is still outstanding in red.
    That is the deepest level IN4 holds for a work order; item and quantity per WO line would need the
    <b>ENGG_WO_BOQ_PRINT_DETAILS</b> feed added to the sync.<br>
    <b>PO lines are its items</b> — unit, ordered qty, rate, value, received qty and GRN value.
    GRN value carries landed cost, so read the quantities across, not the two amounts.</div>`;
}



/* Ordered vs executed per BOQ item — in4_wo_boq_items + in4_wo_abstract_items */
const qty = n => n.toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:3});

function boqPanel(o, oI){
  const items = LIVE.boq[o.id];
  if (!items || !items.length) return '';
  const oa = items.reduce((a,i)=>a+i.oa,0), ea = items.reduce((a,i)=>a+i.ea,0);

  const rows = items.map(it => {
    const key = o.id + ':' + it.id;
    const bills = LIVE.itembills[key] || [];
    const done = it.oq ? it.eq / it.oq * 100 : 0;
    const bid = 'bq' + o.id + '_' + it.id;
    let run = 0;
    const billRows = bills.map(b => {
      run += b.q;
      return `
      <tr class="${bid} billrow" style="display:none">
        <td class="rdesc lvl3">${b.b}<span class="cellref">${b.d}</span></td>
        <td class="num"></td>
        <td class="num"></td>
        <td class="num"></td>
        <td class="num"></td>
        <td class="num">${qty(b.q)}</td>
        <td class="num">${qty(Math.max(0, it.oq - run))}</td>
        <td class="num">${inr(b.a)}</td>
        <td class="num pct">${Math.round(run/it.oq*100)}%</td>
      </tr>`;
    }).join('');

    return `
    <tr class="${bills.length ? 'hastree' : ''}" ${bills.length ? `onclick="tgl('${bid}', this, event)"` : ''}>
      <td class="rdesc">${bills.length ? '<span class="chev">›</span> ' : ''}${it.n}<span class="cellref">item ${it.id}${bills.length ? ' · ' + bills.length + ' bill' + (bills.length>1?'s':'') : ''}</span></td>
      <td class="num">${it.u}</td>
      <td class="num">${qty(it.oq)}</td>
      <td class="num">${inr(it.r)}</td>
      <td class="num">${inr(it.oa)}</td>
      <td class="num">${it.eq ? qty(it.eq) : '<span class="dash">—</span>'}</td>
      <td class="num">${qty(it.oq - it.eq)}</td>
      <td class="num">${it.ea ? inr(it.ea) : '<span class="dash">—</span>'}</td>
      <td class="num pct">${it.eq
        ? `<span class="bar-mini" style="width:42px"><i style="width:${Math.min(100,Math.round(done))}%"></i></span>${done.toFixed(done%1?2:0)}%`
        : '<span class="dash">0%</span>'}</td>
    </tr>${billRows}`;
  }).join('');

  return `
  <tr class="line oo${oI}" style="display:none">
    <td colspan="9" class="treecell">
      <div class="sheetbox">
        <div class="sheethead"><b>BOQ</b>
          <span class="st">${items.length} item${items.length>1?'s':''} · ordered ${inr(oa)}</span>
          <span class="right num">executed ${inr(ea)} · ${pct(ea,oa)}</span></div>
        <div class="uploadbar">
          <span class="ub-step done">1 · Template downloaded</span>
          <span class="ub-arrow">›</span>
          <span class="ub-step">2 · Engineer fills BOQ</span>
          <span class="ub-arrow">›</span>
          <span class="ub-step">3 · Approval</span>
          <span class="ub-arrow">›</span>
          <span class="ub-step">4 · Upload to IN4</span>
          <span class="ub-right"><span class="pill req">⤓ IN4 BOQ template</span>
            <span class="pill req">↥ Upload filled BOQ</span></span>
        </div>
        <table class="sheettable">
          <thead><tr><th>BOQ ITEM / BILL</th><th>UNIT</th><th>ORDERED QTY</th><th>RATE</th><th>ORDER VALUE</th>
            <th>EXECUTED QTY</th><th>BALANCE QTY</th><th>EXECUTED VALUE</th><th>% DONE</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </td>
  </tr>`;
}

function abstractRow(o, oI){
  const g = o.certs.reduce((a,b)=>a+b.g,0);
  const c = o.certs.reduce((a,b)=>a+b.c,0);
  const p = o.certs.reduce((a,b)=>a+b.p,0);
  const r = o.certs.reduce((a,b)=>a+b.ret,0);
  const ar = o.certs.reduce((a,b)=>a+b.adv,0);
  const out = o.certs.reduce((a,b)=>a+b.out,0);
  const running = o.certs.filter(b=>b.t==='Running').length;
  const cell = (l,v,cls) => `<div class="ab"><span>${l}</span><b class="num ${cls||''}">${v}</b></div>`;
  return `
  <tr class="line oo${oI}" style="display:none">
    <td colspan="9" class="abstract">
      <div class="abtitle">Abstract · ${o.no.split('/').slice(-2).join('/')} · ${o.party}
        <span class="count">${running} running bill${running===1?'':'s'} · ${o.certs.length} certificates in all</span></div>
      <div class="abgrid">
        ${cell('Work order value', inr(o.val))}
        ${cell('Gross value with tax', inr(o.gross))}
        ${cell('Gross billed to date', inr(g))}
        ${cell('Certified to date', inr(c))}
        ${cell('Balance to bill', inr(o.val - c), o.val - c < 0 ? 'owed' : '')}
        ${cell('Retention held', inr(r))}
        ${cell('Advance recovered', inr(ar))}
        ${cell('Advance still to recover', inr(o.advbal), o.advbal ? 'owed' : '')}
        ${cell('Paid to date', inr(p))}
        ${cell('Outstanding', inr(out), out ? 'owed' : '')}
        ${cell('Billed against order', pct(c, o.val))}
        ${cell('Paid against certified', pct(p, c))}
        ${(() => {
          const it = LIVE.boq[o.id];
          if (!it) return cell('BOQ', '<span class="na">no BOQ items in IN4</span>');
          const oq = it.reduce((a,x)=>a+x.oa,0), eq = it.reduce((a,x)=>a+x.ea,0);
          return cell('BOQ ordered', inr(oq) + ' · ' + it.length + ' items') +
                 cell('BOQ executed', inr(eq) + ' · ' + pct(eq,oq), eq < oq ? '' : '');
        })()}
      </div>
    </td>
  </tr>`;
}

function tgl(cls, tr, ev){
  if (ev) ev.stopPropagation();
  const open = tr.classList.toggle('open');
  document.querySelectorAll('.'+cls).forEach(k => {
    k.style.display = open ? '' : 'none';
    if (!open) { k.classList.remove('open'); }
  });
  if (!open) {
    const depth = cls.startsWith('cc') ? ['ss','oo'] : cls.startsWith('ss') ? ['oo'] : [];
    depth.forEach(pfx => document.querySelectorAll('tr[class*="'+pfx+'"]').forEach(k => {
      if (k.className.split(' ').some(c => c.startsWith(pfx))) { k.style.display='none'; k.classList.remove('open'); }
    }));
  }
}

          <td class="num">${inr(T.erp)}</td><td class="num">${inr(T.wo)}</td>
          <td class="num">${inr(T.erp-T.wo)}</td><td class="num">${inr(T.paid)}</td>
          <td class="num pct">${pct(T.paid,T.erp)}</td></tr>
      </tbody>
    </table>
    <div class="cards">${cards}</div>
  </div>
  <div class="legend">These are IN4 <b>sub-projects</b>, which is the only project sub-division the
    mirror holds. If a CT is something else — a construction team or a cost centre — tell me which
    IN4 column carries it and this view groups on that instead. <b>Uncommitted</b> = ERP budget − WO/PO
    approved. There is no separate CT HUB budget column here because that figure lives in the hub,
    not in IN4.</div>`;
}

function tiles(T){
  return `
  <div class="tiles">
    <div class="tile"><div class="box">₹</div><div><div class="lab">Budget</div>
      <div class="fig num">${inr(T.b)}</div><div class="ctx">IN4, current revision</div></div></div>
    <div class="tile"><div class="box">◧</div><div><div class="lab">WO / PO approved</div>
      <div class="fig num">${inr(T.w)}</div><div class="ctx">committed</div></div></div>
    <div class="tile"><div class="box">✓</div><div><div class="lab">Certified</div>
      <div class="fig num">${inr(T.a)}</div><div class="ctx">${pct(T.a,T.b)} of budget</div></div></div>
  </div>`;
}

function toggleCat(i, tr){
  const open = tr.classList.toggle('open');
  document.querySelectorAll('.c'+i).forEach(k => {
    k.style.display = open ? '' : 'none';
    if (!open){ k.classList.remove('open'); }
  });
  if (!open) document.querySelectorAll('[class*="s'+i+'_"]').forEach(g => g.style.display='none');
}
function toggleSub(i, j, tr){
  event.stopPropagation();
  const open = tr.classList.toggle('open');
  document.querySelectorAll('.s'+i+'_'+j).forEach(k => k.style.display = open ? '' : 'none');
}

const STUBS = {
  dashboard:{t:'Dashboard', s:'Across all projects',
    p:'Where the portfolio stands, and what is waiting on you today.',
    l:['Money across all projects — budget, committed, certified','What is waiting for your signature','Anything overdue, anything unusual']},
  stores:{t:'Stores', s:'24 stores', p:'Stock by store and by project.',
    l:['Material, unit, quantity in hand','Issued, received, returned','Gate roles see quantity only — no rate, no value']},
  rates:{t:'Established Rates', s:'From IN4 BOQ masters',
    p:'The approved rate for an item, and what it has actually been bought at.',
    l:['Item, unit, established rate','Last purchased rate and date','Needs the BOQ feed added to the sync']},
  accounts:{t:'Accounts', s:'Trust wise', p:'The ledger, cut by party rather than by project.',
    l:['Trust wise → party wise ledger → PV wise','Outstanding by party','Reconcile with trust accounts']},
  masters:{t:'Masters', s:'Set up once, used everywhere',
    p:'Trust, projects, contacts, categories, stores and BOQ. Where IN4 already holds a master, it is pulled — never re-keyed.',
    l:['Trust Master — name, addresses, GST no, PAN no','Project Master — main project, sub-projects, start and end dates',
       'Contact Master — SRMD team, consultants, vendors, contractors','Budget Categories — main and sub category',
       'Store Master','BOQ Master']},
  processes:{t:'SRMD CT Processes', s:'How work is meant to run',
    p:'The written process behind each module, next to the screen that runs it.',
    l:['Approval chains and who signs what','Payment process','PMC roles and responsibilities']},
  admin:{t:'Admin', s:'Rights, reports, alerts',
    p:'Who may see what, what goes out automatically, and what raises a flag.',
    l:['Rights — one role per person, gated on the server','Scheduled reports — Telegram, e-mail, WhatsApp',
       'Alerts — thresholds and the events that raise them','Sync — last run per feed, row counts, errors']},
};

function stubScreen(){
  const s = STUBS[state.screen];
  return header(s.t, s.s, {}) + `<div class="stub"><h3>${s.t}</h3><p>${s.p}</p>
    <ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

function render(){
  renderRail();
  const v = document.getElementById('view');
  v.innerHTML = state.screen === 'projects' ? projectsScreen()
              : state.screen === 'project'  ? projectScreen()
              : stubScreen();
}
render();
</script>
